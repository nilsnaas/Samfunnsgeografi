  <script>
    // 1. Glossary (Single source of truth)
    const GLOSSARY = {
      'urfolk': {
        title: 'Urfolk',
        definition: 'Etniske grupper som har bodd i et bestemt område før statene som dekker området i dag, ble etablert. Mange urfolk har hatt en levemåte preget av mindre omfattende inngrep i naturen enn andre etniske grupper i samme område.'
      },
      'minoritet': {
        title: 'Minoritet',
        definition: 'En gruppe mennesker i et land som er i mindretall og skiller seg fra flertallsbefolkningen gjennom språk, kultur, religion eller etnisk bakgrunn. I Norge har samene status som urfolk, mens jøder, kvener/norskfinner, rom, romanifolket/tatere og skogfinner er nasjonale minoriteter.'
      },
      'assimilering': {
        title: 'Assimilering',
        definition: 'Innebærer at alle kulturelle og språklige kjennetegn en etnisk gruppe har, forsvinner, og at etterkommerne ser på seg selv som tilhørende en annen etnisk gruppe (majoriteten).'
      },
      'segregering': {
        title: 'Segregering',
        definition: 'At ulike folkegrupper holdes atskilt fra hverandre i samfunnet – fysisk, geografisk, sosialt eller rettslig – for eksempel gjennom reservater eller egne skoler.'
      },
      'integrering': {
        title: 'Integrering',
        definition: 'At minoriteter eller urfolk blir en fullverdig og likeverdig del av storsamfunnet (i arbeidsliv, utdanning og politikk), samtidig som de får beholde og utvikle sin egen kultur, språk og identitet.'
      },
      'fornorskningspolitikk': {
        title: 'Fornorskningspolitikk',
        definition: 'Den norske statens offisielle assimileringspolitikk fra ca. 1850 og langt inn i etterkrigstiden, rettet mot samer, kvener/norskfinner og skogfinner, med mål om at de skulle gi opp eget språk og kultur og bli «norske».'
      },
      'ilo169': {
        title: 'ILO-konvensjon 169',
        definition: 'FNs internasjonale arbeidsorganisasjons konvensjon om urfolk og stammefolk i selvstendige stater (vedtatt i 1989, ratifisert av Norge i 1990). Den er rettslig forpliktende og skal sikre urfolks rett til tradisjonelle næringer, språk, kultur og råderett over landområder.'
      },
      'kolonisering': {
        title: 'Kolonisering',
        definition: 'Det at en stat dominert av andre folkegrupper enn dem som opprinnelig har bodd der, tar over et landområde og begynner å utnytte ressursene i området.'
      },
      'ratifikasjon': {
        title: 'Ratifikasjon (å ratifisere)',
        definition: 'Betyr at en internasjonal konvensjon blir godkjent og gjort til en del av lovverket i et land gjennom vedtak i landets lovgivende forsamling.'
      },
      'finnmarksloven': {
        title: 'Finnmarksloven',
        definition: 'Lov vedtatt i 2005 for å følge opp ILO-konvensjon 169. Opprettet Finnmarkseiendommen (FeFo), der Sametinget og fylkestinget sammen forvalter statlig grunn i Finnmark.'
      },
      'sapmi': {
        title: 'Sápmi',
        definition: 'Det nordsamiske navnet på samenes historiske og tradisjonelle bosettingsområde i Nord-Norge, Nord-Sverige, Nord-Finland og Kolahalvøya i Russland (Sábme på lulesamisk, Saepmie på sørsamisk).'
      },
      'nasjon-i-nasjonen': {
        title: 'Nasjon i nasjonen',
        definition: 'Når et urfolk definerer seg som et eget kulturelt og politisk fellesskap med rett til selvstyre innenfor en stats grenser, uten at det står i motsetning til å være en del av statens nasjonsfellesskap.'
      }
    };

    const g = (term, label) => `<button type="button" class="glossary-term" data-term="${term}">${label}</button>`;

    // 2. Knowledge Tree Nodes (Kurs 1.3: Urfolk + Samenes hjemland)
    const NODES = [
      {
        id: 'v1',
        chapter: 'velstand',
        type: 'hovedstamme',
        icon: '🌱',
        x: 500, y: 610,
        parents: [],
        period: '1700-tallet – i dag',
        part: 'Kapittel 4.1 · Velstand',
        title: 'Hva gjør et land rikt?',
        subtitle: 'Arbeidsproduktivitet, menneskelige ressurser og velstand allerede før oljealderen',
        image: 'Images/velstand-heroya.jpg',
        caption: 'Herøya i Porsgrunn (CC BY-SA 2.0). Velstand skapes når naturressurser kombineres med teknologi og menneskelig kunnskap.',
        enkel: `
          <p>Norge var et rikt land allerede på 1960-tallet – før den første oljekrona kom på statsbudsjettet i 1975. Forklaringen er høy <strong>arbeidsproduktivitet</strong> gjennom maskiner og teknologi. <a href="velstand.html#rikt-land" class="underline font-semibold text-emerald-400">Les mer i kapittel 4.1 →</a></p>
        `,
        full: `
          <p>Naturressurser alene gjør ikke et land rikt (se kontrast til råvarerike land med lav levestandard som DR Kongo). Det avgjørende er hvordan naturressurser kombineres med menneskelige ressurser og maskiner, slik at verdiskapingen per arbeidstime øker. Norge ligger på <strong>2. plass i verden</strong> på FNs HDI-indeks og over <strong>50 % over EU-snittet</strong> i BNP per innbygger. <a href="velstand.html#rikt-land" class="underline font-semibold text-emerald-400">Åpne kapittel 4.1: Velstand →</a></p>
        `,
        caseHtml: `

              <div class="flex items-center gap-1.5 min-w-0">
                <span class="text-sm leading-none">${node.icon || '📌'}</span>
                <span class="text-[10px] font-semibold uppercase tracking-wider text-sec truncate">${node.chapter === 'urfolk' ? 'Urfolk' : node.chapter === 'sapmi' ? 'Sápmi' : node.chapter === 'mineraler' ? 'Mineraler' : 'Ressurser'}</span>
              </div>
              ${isVisited ? '<span class="w-4 h-4 rounded-full bg-emerald-500/20 text-emerald-400 text-[10px] font-bold flex items-center justify-center shrink-0" title="Utforsket">✓</span>' : ''}
            </div>
            <p class="text-xs font-bold leading-snug line-clamp-2 mb-1">${node.title}</p>
            <p class="text-[10px] text-sec truncate">${node.period}</p>
          </div>
        `;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          selectNode(node.id);
        });
        treeNodes.appendChild(btn);
      });
    }

    function selectNode(id) {
      activeNodeId = id;
      visitedNodes.add(id);
      const node = NODES.find(n => n.id === id);
      if (!node) return;

      renderTree();
      if (followMode) centerOnNode(node);

      const st = typeStyles[node.type];
      document.getElementById('node-period').textContent = node.period;
      document.getElementById('node-part').textContent = node.part;
      const typeBadge = document.getElementById('node-type-badge');
      typeBadge.className = `px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${st.badge}`;
      typeBadge.textContent = st.label;

      document.getElementById('node-title').textContent = node.title;
      document.getElementById('node-subtitle').textContent = node.subtitle;
      const imgEl = document.getElementById('node-image');
      imgEl.src = node.image;
      imgEl.alt = node.title;
      document.getElementById('node-caption').textContent = node.caption;
      document.getElementById('node-goal').textContent = node.goal;

      renderTabContent();
      bindTooltips();
      document.getElementById('content-pane').scrollTop = 0;
    }

    function renderTabContent() {
      const node = NODES.find(n => n.id === activeNodeId);
      const tabBody = document.getElementById('tab-body');

      if (activeTab === 'fagstoff') {
        const textHtml = readingMode === 'enkel' ? node.enkel : node.full;
        const sumText = node.goal || node.subtitle;
        tabBody.innerHTML = textHtml + `
          <div class="mt-4 elevated-surface border border-emerald-500/30 rounded-xl p-3.5 text-xs sm:text-sm">
            <p class="font-bold uppercase tracking-wider text-emerald-400 text-[11px] mb-1">⚡ Super-sammendrag</p>
            <p class="text-sec">${sumText}</p>
          </div>
        `;
      } else if (activeTab === 'case') {
        tabBody.innerHTML = node.caseHtml;
      } else if (activeTab === 'oppgaver') {
        const q = node.quiz;
        const chosen = nodeQuizState[node.id];
        tabBody.innerHTML = `
          <div class="elevated-surface border rounded-xl p-4 space-y-3">
            <p class="text-xs font-bold uppercase tracking-wider text-emerald-400">Kontrollspørsmål</p>
            <p class="font-semibold text-sm sm:text-base">${q.q}</p>
            <div class="space-y-2">
              ${q.options.map((opt, idx) => {
                let cls = 'elevated-surface border hover:border-emerald-500/50';
                if (chosen !== undefined) {
                  if (idx === q.correct) cls = 'border-emerald-500 bg-emerald-500/15 font-medium';
                  else if (idx === chosen) cls = 'border-rose-500 bg-rose-500/15';
                }
                return `<button type="button" data-opt="${idx}" class="node-quiz-opt w-full text-left px-3.5 py-2 rounded-lg border text-xs sm:text-sm transition-colors ${cls}">${opt}</button>`;
              }).join('')}
            </div>
            ${chosen !== undefined ? `<p class="text-xs sm:text-sm p-2.5 rounded-lg ${chosen === q.correct ? 'bg-emerald-500/15 text-emerald-300' : 'bg-rose-500/15 text-rose-300'}">${chosen === q.correct ? q.feedback : 'Ikke helt riktig – se det grønne alternativet over.'}</p>` : ''}
          </div>
          <div class="elevated-surface border rounded-xl p-4 space-y-1.5">
            <p class="text-xs font-bold uppercase tracking-wider text-amber-400">Reflekter og diskuter</p>
            <p class="text-sm">${node.reflection}</p>
          </div>
        `;
        tabBody.querySelectorAll('.node-quiz-opt').forEach(btn => {
          btn.addEventListener('click', () => {
            nodeQuizState[node.id] = Number(btn.dataset.opt);
            renderTabContent();
          });
        });
      }
      bindTooltips();
    }

    // Tab switching
    document.querySelectorAll('.content-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        activeTab = tab.dataset.tab;
        document.querySelectorAll('.content-tab').forEach(t => {
          const on = t.dataset.tab === activeTab;
          t.className = on
            ? 'content-tab py-2 px-3 rounded-lg text-xs sm:text-sm font-semibold bg-emerald-600 text-white transition-colors'
            : 'content-tab py-2 px-3 rounded-lg text-xs sm:text-sm font-medium text-sec hover:text-current transition-colors';
        });
        renderTabContent();
      });
    });

    // Enkel / Full mode
    const btnEnkel = document.getElementById('mode-enkel');
    const btnFull = document.getElementById('mode-full');
    function setReadingMode(mode) {
      readingMode = mode;
      btnEnkel.className = mode === 'enkel' ? 'px-2.5 py-1 rounded-md transition-colors bg-emerald-600 text-white font-semibold' : 'px-2.5 py-1 rounded-md transition-colors text-sec hover:text-current';
      btnFull.className = mode === 'full' ? 'px-2.5 py-1 rounded-md transition-colors bg-emerald-600 text-white font-semibold' : 'px-2.5 py-1 rounded-md transition-colors text-sec hover:text-current';
      renderTabContent();
    }
    btnEnkel.addEventListener('click', () => setReadingMode('enkel'));
    btnFull.addEventListener('click', () => setReadingMode('full'));

    // Chapter filter pills
    document.querySelectorAll('.chapter-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        activeFilter = pill.dataset.filter;
        document.querySelectorAll('.chapter-pill').forEach(p => {
          const on = p.dataset.filter === activeFilter;
          p.className = on
            ? 'chapter-pill px-3 py-1 rounded-full border border-emerald-500/60 bg-emerald-500/15 text-emerald-300 font-semibold transition-colors flex items-center gap-1.5'
            : 'chapter-pill px-3 py-1 rounded-full border border-slate-500/25 text-sec hover:border-slate-400/50 transition-colors flex items-center gap-1.5';
        });
        renderTree();
        if (activeFilter === 'velstand') selectNode('v1');
        if (activeFilter === 'all') fitOverview();
      });
    });

    // Prev / Next node
    document.getElementById('btn-prev-node').addEventListener('click', () => {
      const idx = NODES.findIndex(n => n.id === activeNodeId);
      const prev = NODES[(idx - 1 + NODES.length) % NODES.length];
      selectNode(prev.id);
    });
    document.getElementById('btn-next-node').addEventListener('click', () => {
      const idx = NODES.findIndex(n => n.id === activeNodeId);
      const next = NODES[(idx + 1) % NODES.length];
      selectNode(next.id);
    });

    // Pan & Zoom on tree viewport
    let isDragging = false, startX = 0, startY = 0;
    treeViewport.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      applyTransform();
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    treeViewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.08 : 0.08;
      scale = Math.min(1.5, Math.max(0.45, scale + delta));
      applyTransform();
    }, { passive: false });

    document.getElementById('btn-zoom-in').addEventListener('click', () => {
      scale = Math.min(1.5, scale + 0.12);
      applyTransform();
    });
    document.getElementById('btn-zoom-out').addEventListener('click', () => {
      scale = Math.max(0.45, scale - 0.12);
      applyTransform();
    });
    document.getElementById('btn-overview').addEventListener('click', fitOverview);

    const btnFollow = document.getElementById('btn-follow');
    btnFollow.addEventListener('click', () => {
      followMode = !followMode;
      btnFollow.className = followMode
        ? 'px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-semibold transition-colors'
        : 'px-2.5 py-1 rounded-lg text-sec hover:text-current transition-colors';
      if (followMode) centerOnNode(NODES.find(n => n.id === activeNodeId));
    });

    // Search
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) { searchResults.classList.add('hidden'); return; }
      const matches = NODES.filter(n =>
        n.title.toLowerCase().includes(q) ||
        n.subtitle.toLowerCase().includes(q) ||
        n.full.toLowerCase().includes(q)
      );
      if (!matches.length) {
        searchResults.innerHTML = `<p class="text-xs text-sec p-2">Ingen treff for «${q}».</p>`;
      } else {
        searchResults.innerHTML = matches.map(m => `
          <button type="button" data-id="${m.id}" class="search-hit w-full text-left p-2.5 rounded-lg hover:bg-emerald-500/10 transition-colors block">
            <p class="text-xs font-bold">${m.title}</p>
            <p class="text-[11px] text-sec truncate">${m.subtitle}</p>
          </button>
        `).join('');
        searchResults.querySelectorAll('.search-hit').forEach(b => {
          b.addEventListener('click', () => {
            selectNode(b.dataset.id);
            searchResults.classList.add('hidden');
            searchInput.value = '';
          });
        });
      }
      searchResults.classList.remove('hidden');
    });
    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.classList.add('hidden');
      }
    });

    // Modals (Ordliste, Quiz, Del / QR)
    const modalBackdrop = document.getElementById('modal-backdrop');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    const openModal = (title, html) => {
      modalTitle.textContent = title;
      modalBody.innerHTML = html;
      modalBackdrop.classList.remove('hidden');
    };
    const closeModal = () => modalBackdrop.classList.add('hidden');
    document.getElementById('modal-close').addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) closeModal(); });

    document.getElementById('btn-ordliste').addEventListener('click', () => {
      const html = `<div class="grid sm:grid-cols-2 gap-3">${Object.values(GLOSSARY).map(item => `
        <div class="elevated-surface border rounded-xl p-4">
          <p class="font-serif font-bold text-base text-emerald-400 mb-1">${item.title}</p>
          <p class="text-xs text-sec leading-relaxed">${item.definition}</p>
        </div>
      `).join('')}</div>`;
      openModal('Ordliste · Sentrale fagbegreper', html);
    });

    document.getElementById('btn-quiz').addEventListener('click', () => {
      const html = NODES.map((n, i) => `
        <div class="elevated-surface border rounded-xl p-4 space-y-2">
          <p class="text-xs text-emerald-400 font-semibold">${n.title}</p>
          <p class="font-semibold text-sm">${i + 1}. ${n.quiz.q}</p>
          <div class="space-y-1.5">
            ${n.quiz.options.map((o, idx) => `
              <button type="button" data-node="${n.id}" data-idx="${idx}" class="modal-q-opt w-full text-left px-3 py-2 rounded-lg border border-slate-500/25 text-xs hover:border-emerald-500/50 transition-colors">${o}</button>
            `).join('')}
          </div>
          <p class="modal-q-fb hidden text-xs p-2 rounded-lg"></p>
        </div>
      `).join('');
      openModal('Samlequiz · Urfolk', html);

      modalBody.querySelectorAll('.modal-q-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const n = NODES.find(x => x.id === btn.dataset.node);
          const idx = Number(btn.dataset.idx);
          const card = btn.closest('.elevated-surface');
          const fb = card.querySelector('.modal-q-fb');
          card.querySelectorAll('.modal-q-opt').forEach((b, i) => {
            b.classList.remove('border-emerald-500', 'bg-emerald-500/15', 'border-rose-500', 'bg-rose-500/15');
            if (i === n.quiz.correct) b.classList.add('border-emerald-500', 'bg-emerald-500/15');
            else if (i === idx) b.classList.add('border-rose-500', 'bg-rose-500/15');
          });
          fb.classList.remove('hidden', 'bg-emerald-500/15', 'text-emerald-300', 'bg-rose-500/15', 'text-rose-300');
          if (idx === n.quiz.correct) {
            fb.classList.add('bg-emerald-500/15', 'text-emerald-300');
            fb.textContent = n.quiz.feedback;
          } else {
            fb.classList.add('bg-rose-500/15', 'text-rose-300');
            fb.textContent = 'Ikke helt riktig – se det grønne alternativet over.';
          }
        });
      });
    });

    document.getElementById('btn-share').addEventListener('click', () => {
      const url = window.location.href;
      openModal('Del denne boka', `
        <p class="text-sm text-sec">Kopier lenken under for å dele denne interaktive læreboksiden, eller åpne den klassiske visningen:</p>
        <div class="flex gap-2">
          <input id="share-url" type="text" readonly value="${url}" class="elevated-surface border rounded-lg px-3 py-2 text-xs flex-1" />
          <button id="copy-share" type="button" class="px-4 py-2 rounded-lg bg-emerald-600 text-white text-xs font-semibold">Kopier</button>
        </div>
        <div class="pt-2 flex gap-2 text-xs">
          <a href="urfolk.html" class="elevated-surface border px-3 py-2 rounded-lg hover:border-emerald-500/50">Klassisk side: Urfolk →</a>
          <a href="samenes-hjemland.html" class="elevated-surface border px-3 py-2 rounded-lg hover:border-emerald-500/50">Klassisk side: Samenes hjemland →</a>
        </div>
      `);
      document.getElementById('copy-share').addEventListener('click', () => {
        navigator.clipboard?.writeText(url);
        document.getElementById('copy-share').textContent = 'Kopiert!';
      });
    });

    document.getElementById('btn-print').addEventListener('click', () => {
      openModal('Last ned kapitler som PDF', `
        <p class="text-sm text-sec">Velg hvilket kapittel du vil laste ned som PDF (åpner utskriftsdialogen der du velger <strong>Lagre som PDF</strong>):</p>
        <div class="grid gap-3 pt-1">
          <a href="urfolk.html?print=1" target="_blank" class="elevated-surface border hover:border-emerald-500/60 rounded-xl p-4 flex items-center justify-between transition-colors">
            <div>
              <p class="font-bold text-sm">📄 Kapittel 1: Urfolk</p>
              <p class="text-xs text-sec">Komplett kapittel med alle illustrasjoner, Fosen-case, Sannhetskommisjonen og ordliste</p>
            </div>
            <span class="text-xs font-semibold text-emerald-400 shrink-0 ml-3">Last ned →</span>
          </a>
          <a href="samenes-hjemland.html?print=1" target="_blank" class="elevated-surface border hover:border-emerald-500/60 rounded-xl p-4 flex items-center justify-between transition-colors">
            <div>
              <p class="font-bold text-sm">📄 Kapittel 2: Samenes hjemland</p>
              <p class="text-xs text-sec">Komplett kapittel om Sápmi, språk, fornorsking, Alta, Sametinget, Fosen og naturvern</p>
            </div>
            <span class="text-xs font-semibold text-emerald-400 shrink-0 ml-3">Last ned →</span>
          </a>
          <a href="mineraler.html?print=1" target="_blank" class="elevated-surface border hover:border-emerald-500/60 rounded-xl p-4 flex items-center justify-between transition-colors">
            <div>
              <p class="font-bold text-sm">📄 Kapittel 3: Fra energinasjon til materialstormakt</p>
              <p class="text-xs text-sec">Komplett kapittel om Fensfeltet, havbunnsmineraler, Dalane, geopolitikk og verdikjeder</p>
            </div>
            <span class="text-xs font-semibold text-emerald-400 shrink-0 ml-3">Last ned →</span>
          </a>
          <a href="ressurser.html?print=1" target="_blank" class="elevated-surface border hover:border-emerald-500/60 rounded-xl p-4 flex items-center justify-between transition-colors">
            <div>
              <p class="font-bold text-sm">📄 Kapittel 4: Norges Ressursparadoks</p>
              <p class="text-xs text-sec">Komplett kapittel om vannkraft, olje, 45 % fossilt forbruk, berggrunn, jord, skog og hav</p>
            </div>
            <span class="text-xs font-semibold text-emerald-400 shrink-0 ml-3">Last ned →</span>
          </a>
          <button id="print-current-node" type="button" class="elevated-surface border hover:border-emerald-500/60 rounded-xl p-4 flex items-center justify-between text-left transition-colors">
            <div>
              <p class="font-bold text-sm">🖨️ Skriv ut / Lagre gjeldende tema</p>
              <p class="text-xs text-sec">Skriver ut temaet du har åpent i Kunnskapstreet akkurat nå</p>
            </div>
            <span class="text-xs font-semibold text-sec shrink-0 ml-3">Skriv ut</span>
          </button>
        </div>
      `);
      document.getElementById('print-current-node').addEventListener('click', () => {
        closeModal();
        setTimeout(() => window.print(), 150);
      });
    });

    // Theme toggle (Dark Kunnskapstre <-> Light Scandinavian)
    const btnTheme = document.getElementById('btn-theme');
    const themeIcon = document.getElementById('theme-icon');
    btnTheme.addEventListener('click', () => {
      const isLight = document.documentElement.classList.toggle('light-theme');
      themeIcon.textContent = isLight ? '🌙' : '☀️';
    });

    // Tooltip logic
    const tooltip = document.getElementById('glossary-tooltip');
    const tooltipTitle = document.getElementById('tooltip-title');
    const tooltipBody = document.getElementById('tooltip-body');
    let hideTimeout = null;

    function showTooltip(trigger) {
      const entry = GLOSSARY[trigger.dataset.term];
      if (!entry) return;
      clearTimeout(hideTimeout);
      tooltipTitle.textContent = entry.title;
      tooltipBody.textContent = entry.definition;
      tooltip.classList.remove('hidden-tooltip');
      tooltip.classList.add('visible-tooltip');
      const rect = trigger.getBoundingClientRect();
      const ttRect = tooltip.getBoundingClientRect();
      let left = Math.max(12, Math.min(rect.left + rect.width / 2 - ttRect.width / 2, window.innerWidth - ttRect.width - 12));
      let top = rect.top - ttRect.height - 10;
      if (top < 12) top = rect.bottom + 10;
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }
    function hideTooltip() {
      tooltip.classList.remove('visible-tooltip');
      tooltip.classList.add('hidden-tooltip');
    }
    function bindTooltips() {
      document.querySelectorAll('.glossary-term').forEach(btn => {
        btn.addEventListener('mouseenter', () => showTooltip(btn));
        btn.addEventListener('mouseleave', () => { hideTimeout = setTimeout(hideTooltip, 150); });
        btn.addEventListener('click', (e) => { e.stopPropagation(); showTooltip(btn); });
      });
    }
    document.getElementById('tooltip-close').addEventListener('click', hideTooltip);
    document.addEventListener('click', (e) => {
      if (!tooltip.contains(e.target) && !e.target.classList.contains('glossary-term')) hideTooltip();
    });

    // Init
    renderTree();
    selectNode('v1');
    setTimeout(fitOverview, 50);
  </script>
</body>
</html>
